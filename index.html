<style>
:root{--side:#0b1020;--sidetxt:#cbd5e1;--blue:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--mut:#64748b;--line:#e2e8f0;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--side)}
#login form{background:#fff;padding:30px;border-radius:14px;width:340px}#login h2{margin-bottom:16px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin:4px 0 12px}
button{cursor:pointer;font:inherit}.btn{background:var(--blue);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600}.btn.g{background:#e2e8f0;color:var(--text)}
#main{display:none;min-height:100vh}
aside{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--side);padding:20px 12px;color:var(--sidetxt);z-index:10;transition:.2s}
aside .logo{color:#fff;font-size:20px;font-weight:800;padding:0 10px 20px}
aside a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:4px}
aside a:hover{background:#1e293b}aside a.on{background:var(--blue);color:#fff}
.nb{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;display:none}
.wrap{margin-left:220px}
header{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h2{font-size:20px;flex:1}#burger{display:none;background:none;border:0;font-size:22px}
#content{padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--card);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 4px #0001}
.stat i{font-style:normal;font-size:26px;background:#eff6ff;border-radius:10px;width:50px;height:50px;display:flex;align-items:center;justify-content:center}
.stat small{color:var(--mut)}.stat b{display:block;font-size:26px}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 4px #0001;margin-bottom:20px;overflow-x:auto}
.card h3{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:12px}
td img{width:44px;height:44px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px}
.tag{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.t-Placed{background:#e0e7ff;color:#3730a3}.t-Progress{background:#fef3c7;color:#b45309}.t-Out{background:#ede9fe;color:#6d28d9}.t-Shipped{background:#dbeafe;color:#1d4ed8}.t-Delivered{background:#dcfce7;color:#15803d}.t-Cancelled{background:#fee2e2;color:#b91c1c}
.ic{background:none;border:0;font-size:17px;padding:4px 6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bn{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.bn img{width:140px;height:60px;object-fit:cover;border-radius:8px}.bn span{flex:1;font-size:12px;color:var(--mut);word-break:break-all}
label{font-size:12px;color:var(--mut)}
@media(max-width:800px){aside{left:-230px}aside.open{left:0}.wrap{margin-left:0}#burger{display:block}#content{padding:14px}}
.isw{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 8px}.ib{position:relative;flex:none;width:130px;height:130px;scroll-snap-align:start;border-radius:10px;overflow:hidden;background:#e2e8f0}.ib img{width:100%;height:100%;object-fit:cover;margin:0;border-radius:0}
.ia{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:4px;background:#0008}.ia button{border:0;background:#2563eb;color:#fff;border-radius:4px;width:28px;height:24px;font-size:12px}
.cv{position:absolute;top:4px;left:4px;background:#16a34a;color:#fff;font-size:10px;padding:1px 6px;border-radius:4px}.ld{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}label.btn{display:inline-block;cursor:pointer}
.chi{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.chi.on{background:#eef4ff}.chi small{color:var(--mut)}.amsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:55vh}.cm{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14px;word-break:break-word}.cm.u{align-self:flex-end;background:var(--blue);color:#fff}.cm.a{align-self:flex-start;background:#eef2f7}.cm small{display:block;font-size:10px;opacity:.7;margin-top:3px}.cpc{display:flex;gap:8px;align-items:center;background:#ffffff40;border-radius:8px;padding:4px;margin-bottom:4px;font-size:12px}.cpc img{width:34px;height:34px;border-radius:6px;object-fit:cover}

.chatw{display:flex}.chl{flex:1 1 260px;max-height:75vh;overflow:auto;border-right:1px solid var(--line)}.cht{flex:2 1 360px;display:flex;flex-direction:column;min-height:60vh;min-width:0}.chh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.chb{display:none;padding:6px 10px}.chr{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.chr textarea{margin:0;flex:1;resize:none}.amsgs{min-height:40vh;max-height:60vh}.cm{white-space:pre-wrap}@media(max-width:800px){.chatw.open .chl{display:none}.chatw:not(.open) .cht{display:none}.chb{display:block}.chatw{display:block}.amsgs{max-height:55vh}}
.cim{max-width:100%;width:200px;border-radius:10px;display:block;margin-bottom:4px}

.ccg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:12px}.cc{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:var(--card)}.cc:hover{border-color:var(--blue)}.cc img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:6px}.cc b{display:block;font-size:14px}.cc small{color:var(--mut)}

 return `<div class="card" style="max-width:680px"><h3>${rvEd?"Edit":"Add"} Review</h3><label>Product</label><select id="rvp" ${rvEd?"disabled":""}>${Object.entries(P).map(([k,p])=>`<option value="${k}" ${rvEd&&rvEd.p==k?"selected":""}>${esc3(p.title)}</option>`).join("")}</select>

 <label>Review text</label><textarea id="rvt" rows="3">${esc3(e.text||"")}</textarea><label>Date</label><input id="rvd" type="date" value="${new Date(e.createdAt||Date.now()).toISOString().slice(0,10)}">

 <div class="card"><h3>All Reviews (${all.length})</h3><table><tr><th>Product</th><th>Customer</th><th>Rating</th><th>Review</th><th></th></tr>${all.map(({p,k,r})=>`<tr><td>${esc3((P[p]||{}).title||p)}</td><td>${r.avatar?`<img src="${esc3(r.avatar)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px">`:""}${esc3(r.name)}</td><td>${"★".repeat(r.rating||0)}</td><td>${esc3((r.text||"").slice(0,60))}</td><td><button class="ic" onclick="rvEdit('${p}','${k}')">✎</button><button class="ic" style="color:var(--red)" onclick="rvDel('${p}','${k}')">🗑</button></td></tr>`).join("")||"<tr><td colspan=5>No reviews</td></tr>"}</table></div>`};

 e.innerHTML=`<div class="row" style="align-items:center;gap:10px;flex-wrap:wrap"><img src="${rvAv||IMG}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;max-width:56px"><label class="btn g" style="flex:none">Profile image<input type="file" accept="image/*" hidden onchange="rvUp(this.files,'av');this.value=''"></label><input placeholder="or image URL" style="margin:0;flex:1;min-width:120px" onchange="rvSetAv(this.value)">${rvAv?'<button class="ic" onclick="rvSetAv(\'\')">×</button>':""}</div>
 <div class="isw" style="margin-top:8px">${rvPh.map((u,i)=>`<div class="ib" style="width:90px;height:90px"><img src="${esc3(u)}"><div class="ia"><button style="background:var(--red);width:100%" onclick="rvRmPh(${i})">×</button></div></div>`).join("")}</div>
 <label class="btn g" style="margin-top:6px">+ Review photos (${rvPh.length}/3)<input type="file" accept="image/*" multiple hidden onchange="rvUp(this.files,'ph');this.value=''"></label>`}
